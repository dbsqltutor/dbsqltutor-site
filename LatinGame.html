<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gladius Verborum - Latin Flashcards</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background: #2c0e0e; /* Pompeian Red */
            background-image: linear-gradient(rgba(44, 14, 14, 0.85), rgba(44, 14, 14, 0.85)), 
                              url('https://www.transparenttextures.com/patterns/marble-pavement.png');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #f3e5ab; /* Parchment Gold */
        }
        
        h1 {
            font-variant: small-caps;
            letter-spacing: 6px;
            margin-bottom: 0px;
            color: #d4af37;
            text-shadow: 3px 3px 6px #000;
            font-size: 3rem;
            text-align: center;
        }

        .subtitle {
            color: #d4af37;
            font-style: italic;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-align: center;
        }
        
        #mode-indicator {
            height: 25px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Chapter Selection */
        .deck-selector {
            margin-bottom: 20px;
        }

        select {
            padding: 8px 16px;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            font-weight: bold;
            background-color: #f3e5ab;
            color: #800000;
            border: 2px solid #d4af37;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }

        .scene {
            width: 400px;
            height: 280px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 2px;
            text-align: center;
            background: #fffdf5; /* Parchment */
            border: 10px double #d4af37; /* Roman Border */
        }

        .card__face--front {
            font-size: 28px;
            font-weight: bold;
            color: #800000; /* Imperial Red */
        }

        .card__face--back {
            transform: rotateY(180deg);
            font-size: 20px;
            background-color: #f5f5dc;
            color: #1a1a1a;
            overflow-y: auto;
        }

        .notes {
            font-size: 15px;
            color: #5d4037;
            margin-top: 15px;
            border-top: 1px solid #d4af37;
            padding-top: 10px;
            font-style: italic;
        }

        .star-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 35px;
            color: #e0e0e0;
            cursor: pointer;
            transition: color 0.3s, transform 0.2s;
            z-index: 10;
        }

        .star-indicator.marked {
            color: #d4af37;
            text-shadow: 0 0 10px #ffd700;
        }

        /* Navigation controls */
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            background-color: #800000; /* Legion Red */
            color: #f3e5ab;
            border: 2px solid #d4af37;
            transition: all 0.3s;
            box-shadow: 4px 4px 0px #000;
        }

        button:hover {
            background-color: #a00000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        button:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0px #000;
        }

        #shuffle-btn { background-color: #4a5d23; border-color: #d4af37; } /* Laurel Green */
        #review-btn { background-color: #4b0082; border-color: #d4af37; } /* Imperial Purple */

        #counter {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #d4af37;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <h1>⚔️ Gladius Verborum ⚔️</h1>
    <div class="subtitle">Sharpen your mind, conquer the tongue.</div>

    <div class="deck-selector">
        <select id="chapter-select" onchange="changeChapter()">
            <option value="1">Chapter 1</option>
            <option value="2">Chapter 2</option>
            <option value="3">Chapter 3</option>
            <option value="4">Chapter 4</option>
            <option value="5">Chapter 5</option>
            <option value="6">Chapter 6</option>
            <option value="7">Chapter 7</option>
            <option value="all">All Chapters</option>
        </select>
    </div>
    
    <div id="mode-indicator"></div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card__face card__face--front">
                <div class="star-indicator" id="front-star" onclick="toggleMark(event)">★</div>
                <div id="front-text"></div>
            </div>
            <div class="card__face card__face--back">
                <div class="star-indicator" id="back-star" onclick="toggleMark(event)">★</div>
                <div id="back-text"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">⇦ Previous</button>
        <button onclick="flipCard()">Examine</button>
        <button onclick="nextCard()">Next ⇨</button>
    </div>

    <div class="controls">
        <button id="mark-btn" onclick="toggleMark(event)">Mark for Review</button>
        <button id="shuffle-btn" onclick="shuffleCards()">Shuffle Deck</button>
        <button id="review-btn" onclick="toggleReviewMode()">Review Marked Only</button>
    </div>
    
    <div id="counter"></div>

    <script>

        const chapter7 = [
            { front: "amor, amōris", back: "m. - love", notes: "(amorous, enamored; cf. amō, amīcus)" },
            { front: "carmen, carminis", back: "n. - song, poem", notes: "(charm)" },
            { front: "cīvitās, cīvitātis", back: "f. - state, citizenship", notes: "(city)" },
            { front: "corpus, corporis", back: "n. - body", notes: "(corps, corpse, corpuscle, corpulent, corporal, corporeal, corporate, corporation, incorporate, corsage, corset)" },
            { front: "homō, hominis", back: "m. - human being, man", notes: "(homicide, homage; homo sapiens; cf. hūmānus and vir)" },
            { front: "labor, labōris", back: "m. - labor, work, toil; a work, production", notes: "(laboratory, belabor, laborious, collaborate, elaborate)" },
            { front: "littera, litterae", back: "f. - a letter of the alphabet<br>pl. - a letter (epistle), literature", notes: "(literal, letters, belles-lettres, illiterate, alliteration)" },
            { front: "mōs, mōris", back: "m. - habit, custom, manner<br>pl. mōrēs - habits, morals, character", notes: "(mores, moral, immoral, immorality, morale, morose)" },
            { front: "nōmen, nōminis", back: "n. - name", notes: "(nomenclature, nominate, nominative, nominal, noun, pronoun, renown, denomination, ignominy, misnomer)" },
            { front: "pāx, pācis", back: "f. - peace", notes: "(pacify, pacific, pacifist, appease, pay)" },
            { front: "rēgīna, rēgīnae", back: "f. - queen", notes: "(Regina, regina, reginal)" },
            { front: "rēx, rēgis", back: "m. - king", notes: "(regal, regalia, regicide, royal; cf. rajah)" },
            { front: "tempus, temporis", back: "n. - time; occasion, opportunity", notes: "(tempo, temporary, contemporary, temporal, temporize, extempore, tense)" },
            { front: "terra, terrae", back: "f. - earth, ground, land, country", notes: "(terrestrial, terrace, terrier, territory, inter, parterre, subterranean, terra cotta)" },
            { front: "uxor, uxōris", back: "f. - wife", notes: "(uxorial, uxorious, uxoricide)" },
            { front: "virgō, virginis", back: "f. - maiden, virgin", notes: "(virgin, virginal, virginity, Virginia)" },
            { front: "virtūs, virtūtis", back: "f. - manliness, courage; excellence, character, worth, virtue", notes: "(virtuoso, virtuosity, virtual; cf. vir)" },
            { front: "novus, nova, novum", back: "adj. - new; strange", notes: "(novel, novelty, novice, innovate)" },
            { front: "post", back: "prep. + acc. - after, behind", notes: "(posterity, posterior, posthumous, post mortem, preposterous; post- prefix)" },
            { front: "sub", back: "prep. + abl. (rest) / acc. (motion) - under, up under, close to; down to/into", notes: "(subterranean, suburb, succeed, suffix, suggest, support, sustain)" },
            { front: "audeō, audēre, ausus sum", back: "v. (semi-deponent) - to dare", notes: "(audacious, audacity)" },
            { front: "necō, necāre, necāvī, necātum", back: "v. - to murder, kill", notes: "(internecine; cf. nocēre, to harm)" }
        ];

        let baseList = [...chapter1]; 
        let currentList = baseList;
        let isReviewMode = false;
        let isDeckComplete = false;
        let currentIndex = 0;
        
        const cardElement = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const counterElement = document.getElementById('counter');
        const modeIndicator = document.getElementById('mode-indicator');
        const stars = document.querySelectorAll('.star-indicator');

        // Initialize
        updateCard();

        function changeChapter() {
            const selection = document.getElementById('chapter-select').value;
            switch(selection) {
                case "1": baseList = [...chapter1]; break;
                case "2": baseList = [...chapter2]; break;
                case "3": baseList = [...chapter3]; break;
                case "4": baseList = [...chapter4]; break;
                case "5": baseList = [...chapter5]; break;
                case "6": baseList = [...chapter6]; break;
                case "7": baseList = [...chapter7]; break;
                case "all": baseList = [...chapter1, ...chapter2, ...chapter3, ...chapter4, ...chapter5, ...chapter6, ...chapter7]; break;
            }
            
            // Exit modes and reset
            isReviewMode = false;
            isDeckComplete = false;
            document.getElementById('review-btn').innerText = "Review Marked Only";
            modeIndicator.innerText = "";
            
            currentList = baseList;
            currentIndex = 0;
            updateCard();
        }

        function flipCard() {
            if (isDeckComplete) return; 
            cardElement.classList.toggle('is-flipped');
        }

        function toggleMark(event) {
            if (event) event.stopPropagation(); 
            if (isDeckComplete) return;

            const currentWord = currentList[currentIndex];
            currentWord.marked = !currentWord.marked;
            
            if (isReviewMode && currentList.filter(w => w.marked).length === 0) {
                alert("The list is empty. Returning to the full legion.");
                toggleReviewMode();
                return;
            }
            updateUI();
        }

        function toggleReviewMode() {
            if (!isReviewMode) {
                const markedItems = baseList.filter(word => word.marked);
                if (markedItems.length === 0) {
                    alert("No words marked for battle! Select the star (★) to mark words.");
                    return;
                }
                currentList = markedItems;
                isReviewMode = true;
                isDeckComplete = false;
                document.getElementById('review-btn').innerText = "Return to Full Legion";
                modeIndicator.innerText = "⚔️ Selective Drill Active ⚔️";
            } else {
                currentList = baseList;
                isReviewMode = false;
                isDeckComplete = false;
                document.getElementById('review-btn').innerText = "Review Marked Only";
                modeIndicator.innerText = "";
            }
            currentIndex = 0;
            updateCard();
        }

        function startReviewFromCompletion(event) {
            if (event) event.stopPropagation();
            
            const markedItems = baseList.filter(word => word.marked);
            currentList = markedItems;
            isReviewMode = true;
            isDeckComplete = false;
            
            document.getElementById('review-btn').innerText = "Return to Full Legion";
            modeIndicator.innerText = "⚔️ Selective Drill Active ⚔️";
            currentIndex = 0;
            updateCard();
        }

        function restartDeck(event) {
            if (event) event.stopPropagation();
            isDeckComplete = false;
            currentIndex = 0;
            updateCard();
        }

        function showCompletionScreen() {
            cardElement.classList.remove('is-flipped');
            setTimeout(() => {
                const markedCount = baseList.filter(w => w.marked).length;
                
                let reviewHtml = markedCount > 0 
                    ? `<button onclick="startReviewFromCompletion(event)" style="margin-bottom: 15px; width: 80%; background-color: #4b0082; font-size: 14px;">Review ${markedCount} Marked Word(s)</button><br>` 
                    : `<div class="notes" style="margin-bottom: 20px;">No words marked for review!</div>`;
                
                frontText.innerHTML = `
                    <div style="font-size: 36px; color: #800000; margin-bottom: 10px;">FINIS!</div>
                    <div style="font-size: 18px; color: #1a1a1a; margin-bottom: 25px;">You have inspected every word.</div>
                    ${reviewHtml}
                    <button onclick="restartDeck(event)" style="width: 80%; font-size: 14px;">Restart Deck</button>
                `;
                
                stars.forEach(star => star.style.display = 'none');
                counterElement.innerText = "Deck Complete";
                document.getElementById('mark-btn').innerText = "Mark for Drill";
            }, 150);
        }

        function updateCard() {
            if (isDeckComplete) {
                showCompletionScreen();
                return;
            }

            cardElement.classList.remove('is-flipped');
            setTimeout(() => {
                stars.forEach(star => star.style.display = 'block'); 

                const currentWord = currentList[currentIndex];
                frontText.innerHTML = currentWord.front;
                
                let notesHtml = currentWord.notes ? `<div class="notes">${currentWord.notes}</div>` : '';
                backText.innerHTML = `<div>${currentWord.back}</div>${notesHtml}`;
                
                counterElement.innerText = `${currentIndex + 1} / ${currentList.length}`;
                updateUI();
            }, 150);
        }

        function updateUI() {
            if (isDeckComplete) return;

            const currentWord = currentList[currentIndex];
            stars.forEach(star => {
                currentWord.marked ? star.classList.add('marked') : star.classList.remove('marked');
            });
            document.getElementById('mark-btn').innerText = currentWord.marked ? "Dismiss Mark" : "Mark for Drill";
        }

        function nextCard() {
            if (isDeckComplete) return; 
            
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                isDeckComplete = true;
                updateCard();
            }
        }

        function prevCard() {
            if (isDeckComplete) {
                isDeckComplete = false;
                currentIndex = currentList.length - 1; 
                updateCard();
                return;
            }
            
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            for (let i = currentList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
            }
            currentIndex = 0;
            isDeckComplete = false; 
            updateCard();
        }

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', function(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA' || event.target.tagName === 'SELECT') return;

            if (event.code === 'Space') {
                event.preventDefault(); 
                flipCard();
            } else if (event.code === 'ArrowRight') {
                nextCard();
            } else if (event.code === 'ArrowLeft') {
                prevCard();
            }
        });
    </script>
</body>
</html>
